<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Deep Obsidian Surface (#0b0d12 -> #101218) -->
    <linearGradient id="sout-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131620" />
      <stop offset="55%" stop-color="#0b0d12" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Subtle Zinc + Neon Magenta Border -->
    <linearGradient id="sout-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e945f5" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#3f3f46" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.85" />
    </linearGradient>

    <!-- FloatingLines-inspired Wave Gradient -->
    <linearGradient id="wave-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e945f5" stop-opacity="0" />
      <stop offset="35%" stop-color="#e945f5" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <!-- Raster Monogram Gradient (#ffffff -> #e945f5 -> #a855f7) -->
    <linearGradient id="raster-s" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f0abfc" />
      <stop offset="100%" stop-color="#e945f5" />
    </linearGradient>

    <!-- Ambient Purple Aura -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e945f5" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#9333ea" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Neon Glow -->
    <filter id="s-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sout-bg)" stroke="url(#sout-border)" stroke-width="2.5" />

  <!-- Ambient Center Aura -->
  <circle cx="64" cy="64" r="46" fill="url(#aura)" />

  <!-- Floating Wave Lines (echoing FloatingLines background) -->
  <path d="M 10 50 C 38 36, 90 64, 118 48" stroke="url(#wave-line)" stroke-width="1.5" opacity="0.55" />
  <path d="M 10 66 C 42 80, 86 50, 118 66" stroke="url(#wave-line)" stroke-width="1.5" opacity="0.75" />
  <path d="M 10 82 C 40 68, 88 94, 118 78" stroke="url(#wave-line)" stroke-width="1.5" opacity="0.45" />

  <!-- Interference Monospace Brackets [ ] -->
  <path d="M 27 40 H 18 V 88 H 27" stroke="#a855f7" stroke-width="3" stroke-linecap="square" opacity="0.75" />
  <path d="M 101 40 H 110 V 88 H 101" stroke="#a855f7" stroke-width="3" stroke-linecap="square" opacity="0.75" />

  <!-- Raster-Serif 'S' Monogram -->
  <g filter="url(#s-glow)" fill="url(#raster-s)">
    <!-- Top bar -->
    <rect x="46" y="29" width="36" height="10" rx="1.5" />
    <!-- Top-right pixel serif -->
    <rect x="78" y="39" width="10" height="8" rx="1" />
    <!-- Upper-left vertical -->
    <rect x="38" y="37" width="11" height="22" rx="1.5" />
    <!-- Center bridge -->
    <rect x="46" y="57" width="36" height="12" rx="1.5" />
    <!-- Lower-right vertical -->
    <rect x="79" y="67" width="11" height="24" rx="1.5" />
    <!-- Bottom-left pixel serif -->
    <rect x="40" y="81" width="10" height="8" rx="1" />
    <!-- Bottom bar -->
    <rect x="46" y="89" width="36" height="10" rx="1.5" />
  </g>
</svg>
